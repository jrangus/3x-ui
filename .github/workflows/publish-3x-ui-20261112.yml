name: Publish 3x-ui-20261112

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Start verified release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref release-3x-ui-20261112-source \
            -f source_ref=117743bcd626945cc96a5445f6de20f762e922cb \
            -f release_tag=3x-ui-20261112
