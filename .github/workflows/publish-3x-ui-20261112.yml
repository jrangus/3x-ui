name: Publish 3x-ui-20261112

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Start verified release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref release-3x-ui-20261112-source \
            -f source_ref=996040f4837405648e955322f959a9cbf185a97b \
            -f release_tag=3x-ui-20261112
