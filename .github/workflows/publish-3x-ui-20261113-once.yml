name: Publish 3x-ui-20261113 once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-3x-ui-20261113-once.yml

permissions:
  actions: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: 3x-ui-20261113
      SOURCE_BRANCH: release-3x-ui-20261113-source
      SOURCE_SHA: dcfa3bf2c9837a5e0fee30f8fa923d0bc5252f0f
    steps:
      - uses: actions/checkout@v4

      - name: Verify source and create draft release
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$SOURCE_BRANCH" --jq .object.sha)"
          test "$current" = "$SOURCE_SHA"

          if gh release view "$RELEASE_TAG" --json isDraft,targetCommitish > /tmp/release.json 2>/dev/null; then
            test "$(jq -r .isDraft /tmp/release.json)" = "true"
            test "$(jq -r .targetCommitish /tmp/release.json)" = "$SOURCE_SHA"
          else
            gh release create "$RELEASE_TAG" --target "$SOURCE_SHA" --draft \
              --title "$RELEASE_TAG" \
              --notes "SSTP exits no longer require IP-type intelligence. xnvgatebox stable exits remain isolated; all supplemental exits use the SSTP pool category."
          fi

      - name: Build and publish tested release
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref "$SOURCE_BRANCH" \
            -f source_ref="$SOURCE_SHA" \
            -f release_tag="$RELEASE_TAG"

          run_id=""
          for _ in $(seq 1 40); do
            run_id="$(gh run list --workflow release.yml --event workflow_dispatch \
              --branch "$SOURCE_BRANCH" --limit 30 \
              --json databaseId,headSha \
              --jq '.[] | select(.headSha == env.SOURCE_SHA) | .databaseId' | head -n 1)"
            test -n "$run_id" && break
            sleep 3
          done
          [[ "$run_id" =~ ^[0-9]+$ ]]
          gh run watch "$run_id" --exit-status

          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "false"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" \
            -f sha="$SOURCE_SHA" -F force=true

          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$RELEASE_TAG/x-ui.sh" \
            -o /tmp/x-ui.sh
          test "$(head -n 1 /tmp/x-ui.sh)" = '#!/bin/bash'
          bash -n /tmp/x-ui.sh
          grep -q 'local version="v0.9.13"' /tmp/x-ui.sh
          grep -q 'local installer_revision="513714b7e655e9d88d472fb39d014e9f61430c1d"' /tmp/x-ui.sh
          grep -q 'local package_sha256="0e48b6322baef6e84e2b7cb651c9f8e8579157958424f10273aeb047629a64ac"' /tmp/x-ui.sh
