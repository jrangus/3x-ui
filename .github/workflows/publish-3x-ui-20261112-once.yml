name: Publish 3x-ui-20261112 once
on:
  push:
    paths: ['.github/workflows/publish-3x-ui-20261112-once.yml']
permissions:
  actions: write
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: c54099ba10df9965d8dbcaac74197534e2343a35
      RELEASE_TAG: 3x-ui-20261112
    steps:
      - name: Publish dated release
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --target "$SOURCE_SHA" --draft --title "$RELEASE_TAG" --notes "Separates xnvgatebox stable, new residential and new native-datacenter exits; prevents mixed-source groups; disables unusable loopback subscriptions in embedded mode; records exact candidate source. Pins tested xnvgatebox v0.9.10. dev-latest and dev-6d205a91-backup remain unchanged."
          gh workflow run release.yml --ref main -f source_ref="$SOURCE_SHA" -f release_tag="$RELEASE_TAG"
