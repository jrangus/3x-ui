name: Publish 3x-ui-20261112 once
on:
  push:
    paths: ['.github/workflows/publish-3x-ui-20261112-once.yml']
permissions:
  actions: write
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Dispatch existing dated release
        run: gh workflow run release.yml --ref main -f source_ref=c54099ba10df9965d8dbcaac74197534e2343a35 -f release_tag=3x-ui-20261112
